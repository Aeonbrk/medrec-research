schema_version = 1
project_id = "medrec-research"
target_id = "319-wild"
ssh_profiles = ["319-lab", "319-lab-via-server"]
remote_python = "/root/anaconda3/envs/medrec-core-evaluator/bin/python"
remote_module = "medrec_research.aris_transport_remote"
runtime_relative = "aris/medrec-research"
queue_manager_relative = "skills/experiment-queue/scripts/queue_manager.py"
poll_seconds = 60

[resource_profiles.single-gpu-low-cost]
gpu_pool = [0, 1, 2, 3, 4, 5, 6, 7]
gpu_count = 1
max_parallel = 1
oom_retry_delay_seconds = 120
oom_retry_max_attempts = 1

[[launch_templates]]
launch_template_id = "safedrug-main-gamenet-source-native"
enabled = true
environment_id = "medrec-gamenet"
source_relative = "sources/safedrug-main-checkout"
data_relative = "datasets/medrec-data-root/safedrug-main/output"
workdir_relative = "src"
output_relative = "GAMENet"
command = ["python", "GAMENet.py", "--cuda", "0"]
expected_output_relative = "history_GAMENet.pkl"

[[launch_templates]]
launch_template_id = "safedrug-main-source-native"
enabled = false
blocker = "transport-launch-unverified"

[[launch_templates]]
launch_template_id = "molerec-source-native"
enabled = false
blocker = "transport-launch-unverified"

[[launch_templates]]
launch_template_id = "safedrug-main-retain-source-native"
enabled = false
blocker = "transport-launch-unverified"

[[launch_templates]]
launch_template_id = "safedrug-main-leap-source-native"
enabled = false
blocker = "transport-launch-unverified"
