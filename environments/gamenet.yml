# Provisional 319 Linux GPU integration environment. Not a verified reproduction lock.
name: medrec-gamenet
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - pip
  - pytorch=1.8.0
  - cudatoolkit=11.1
  - numpy=1.21.1
  - pandas=1.3.0
  - scipy
  - scikit-learn=0.24.2
  - dill=0.3.4
  - pip:
      # Upstream imports dnc but does not identify a version. Pin before smoke readiness.
      - dnc
