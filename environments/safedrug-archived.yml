# Candidate 319 reproduction environment for SafeDrug archived baseline.
# An explicit lock is exported and registered only after runtime and staged-data validation.
name: medrec-safedrug-archived
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11.9
  - pytorch=2.2.2
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - numpy=1.23.5
  - pandas=2.0.3
  - scipy=1.11.4
  - scikit-learn=1.3.2
  - rdkit=2023.09.6
  - dill=0.3.7
  - pip
  - pip:
      - dnc==1.1.0
